<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lukas Tech Exchange Hub</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #111827;
      --accent-color: #10b981;
      --text-color: #f3f4f6;
      --border-color: #1f2937;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: var(--card-bg);
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { margin: 0; font-size: 1.2rem; color: var(--accent-color); }
    .status { font-size: 0.85rem; color: #9ca3af; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1rem;
      gap: 1rem;
      overflow: hidden;
    }
    .chat-box {
      flex: 1;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .message {
      padding: 0.5rem 0.8rem;
      border-radius: 6px;
      max-width: 80%;
      word-break: break-word;
    }
    .system { background-color: #374151; align-self: center; font-size: 0.8rem; }
    .received { background-color: #1f2937; align-self: flex-start; }
    .sent { background-color: #059669; align-self: flex-end; }
    .input-area {
      display: flex;
      gap: 0.5rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-color);
    }
    button {
      padding: 0.75rem 1.2rem;
      border-radius: 6px;
      border: none;
      background-color: var(--accent-color);
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }
    .controls {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Tech Exchange Hub</h1>
    <div class="status" id="status">Verbinde...</div>
  </header>
  <main>
    <div class="controls">
      <button onclick="copyInviteLink()">Einladungs-Link kopieren</button>
    </div>
    <div class="chat-box" id="chat">
      <div class="message system">Willkommen im Hub! Sende deinen Link an Freunde, um zu chatten.</div>
    </div>
    <div class="input-area">
      <input type="text" id="msgInput" placeholder="Nachricht schreiben..." onkeypress="handleKey(event)">
      <button onclick="sendMessage()">Senden</button>
    </div>
  </main>

  <script>
    const peer = new Peer();
    let conn = null;

    peer.on('open', (id) => {
      document.getElementById('status').innerText = 'Bereit | ID: ' + id;
      const urlParams = new URLSearchParams(window.location.search);
      const targetId = urlParams.get('peer');
      if (targetId) {
        connectToPeer(targetId);
      }
    });

    peer.on('connection', (c) => {
      conn = c;
      setupConnection();
      addMessage('Freund ist beigetreten!', 'system');
    });

    function connectToPeer(id) {
      conn = peer.connect(id);
      setupConnection();
    }

    function setupConnection() {
      conn.on('open', () => {
        document.getElementById('status').innerText = 'Verbunden!';
        addMessage('Verbindung hergestellt!', 'system');
      });
      conn.on('data', (data) => {
        addMessage(data, 'received');
      });
    }

    function sendMessage() {
      const input = document.getElementById('msgInput');
      const msg = input.value.trim();
      if (!msg) return;
      
      addMessage(msg, 'sent');
      if (conn && conn.open) {
        conn.send(msg);
      } else {
        addMessage('Hinweis: Niemand empfängt deine Nachricht. Sende zuerst den Einladungs-Link!', 'system');
      }
      input.value = '';
    }

    function addMessage(text, type) {
      const chat = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = 'message ' + type;
      div.innerText = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function handleKey(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function copyInviteLink() {
      if (!peer.id) return alert('Noch keine Verbindung zum Server!');
      const link = window.location.origin + window.location.pathname + '?peer=' + peer.id;
      navigator.clipboard.writeText(link);
      alert('Einladungs-Link kopiert! Schicke ihn deinen Freunden.');
    }
  </script>
</body>
</html>
